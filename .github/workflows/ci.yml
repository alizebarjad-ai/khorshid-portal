name: Portal CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/membership-review-workflow, feat/unified-request-workflow, security/role-access-hardening]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - name: Refresh semver-compatible dependency tree
        run: npm update --package-lock-only --ignore-scripts
      - name: Commit initial lockfile on security branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/role-access-hardening'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add audited npm lockfile"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:security/role-access-hardening
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:x.title)}))},null,2))'
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: portal-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
